name: Desktop Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_call:

permissions:
  contents: read

jobs:
  desktop-quality:
    name: Desktop checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate desktop sources
        run: npm run desktop:check

      - name: Run SQLite storage test
        run: npm run desktop:test-storage

      - name: Run desktop smoke test
        run: npm run desktop:smoke
