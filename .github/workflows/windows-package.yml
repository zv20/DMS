name: Package build - reusable

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false

permissions:
  contents: read

jobs:
  package:
    name: Build and verify packages
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = "$env:REQUESTED_VERSION".TrimStart('v')
          if (!$version) {
            $version = dotnet msbuild DMS/DMS.csproj -getProperty:Version -p:Platform=x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'MSI packages require a three-part numeric version.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish self-contained x64 app
        run: >-
          dotnet publish DMS/DMS.csproj --configuration Release --runtime win-x64
          --self-contained true -p:Platform=x64
          --output artifacts/DMS-win-x64

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add --global WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add --global WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish upgrade backup helper
        run: >-
          dotnet publish installer/BackupHelper/BackupHelper.csproj --configuration Release
          --runtime win-x64 --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/backup-helper

      - name: Build MSI installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          $publishDir = (Resolve-Path artifacts/DMS-win-x64).Path
          python scripts/installer-release-notes.py $version artifacts/installer/release-notes.rtf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseNotes = (Resolve-Path artifacts/installer/release-notes.rtf).Path
          $backupHelper = (Resolve-Path artifacts/backup-helper/BackupHelper.exe).Path
          wix build installer/DMS.wxs -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -arch x64 -d "Version=$version" -d "PublishDir=$publishDir" -d "ReleaseNotesFile=$releaseNotes" -d "BackupHelper=$backupHelper" -o "artifacts/installer/DMS-Setup-$version.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase((Resolve-Path "artifacts/installer/DMS-Setup-$version.msi").Path, 0)
          foreach ($dialog in @('WelcomeDlg', 'UpgradeInfoDlg', 'VerifyReadyDlg', 'ExitDialog')) {
            $view = $database.OpenView("SELECT ``Dialog`` FROM ``Dialog`` WHERE ``Dialog`` = '$dialog'")
            $view.Execute()
            if (!$view.Fetch()) { throw "Missing installer dialog: $dialog" }
            $view.Close()
          }

      - name: Install and start packaged DMS with disposable data
        shell: pwsh
        run: |
          . ./scripts/wait-for-app-file.ps1
          $version = $env:RELEASE_VERSION
          $installDir = Join-Path $env:RUNNER_TEMP 'DMS-installed'
          $setup = (Resolve-Path "artifacts/installer/DMS-Setup-$version.msi").Path
          $setupLog = Join-Path $env:RUNNER_TEMP 'dms-setup.log'
          # A leftover Inno uninstall entry must not block MSI installation.
          $legacyKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{62CF39B5-8F17-4242-9DE5-99B3A75219ED}_is1'
          New-Item -Path $legacyKey -Force | Out-Null
          New-ItemProperty -Path $legacyKey -Name UninstallString -Value 'legacy-uninstaller.exe' -Force | Out-Null
          $result = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', "`"$setup`"", '/qn', '/norestart', "INSTALLFOLDER=`"$installDir`"", '/l*v', "`"$setupLog`"") -Wait -PassThru
          if ($result.ExitCode -ne 0) { if (Test-Path $setupLog) { Get-Content $setupLog }; throw "Installer exited with $($result.ExitCode)" }
          foreach ($path in @('DMS.exe', 'DMS.pri', 'Assets/logo.png')) {
            if (!(Test-Path (Join-Path $installDir $path))) { throw "Missing installed file: $path" }
          }
          $dataDir = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'DMS'
          $env:DMS_QA_READY_FILE = Join-Path $env:RUNNER_TEMP 'dms-ready.txt'
          Remove-Item $env:DMS_QA_READY_FILE -Force -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath (Join-Path $installDir 'DMS.exe') -WorkingDirectory $installDir -PassThru
          try {
            Wait-DmsAppFile $app $env:DMS_QA_READY_FILE 'Installed DMS main window startup'
            $localized = Get-Content $env:DMS_QA_READY_FILE -Raw
            if (!$localized -or $localized.Trim() -eq 'MenuViewSelected') { throw 'Installed DMS did not load its localized resources.' }
            Write-Host 'Installed DMS reached its main window and loaded localized resources.'
          } finally {
            $app.Refresh()
            if (!$app.HasExited) {
              Stop-Process -Id $app.Id -Force
              $app.WaitForExit()
            }
          }
          $database = Join-Path $dataDir 'dms.db'
          if (!(Test-Path $database)) { throw 'DMS did not create its database.' }
          $databaseHash = (Get-FileHash $database).Hash
          $result = Start-Process -FilePath msiexec.exe -ArgumentList @('/x', "`"$setup`"", '/qn', '/norestart') -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstall exited with $($result.ExitCode)" }
          if (Test-Path (Join-Path $installDir 'DMS.exe')) { throw 'DMS.exe remained after uninstall.' }
          if (!(Test-Path $database) -or (Get-FileHash $database).Hash -ne $databaseHash) { throw 'Uninstall removed or changed the application database.' }

      - name: Verify upgrade from the previous MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_VERSION
          $previousVersion = gh release list --repo ${{ github.repository }} --limit 1000 --json tagName,isDraft,isPrerelease | python scripts/previous-release.py $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Testing upgrade from $previousVersion to $version"
          $previousMsi = "DMS-Setup-$previousVersion.msi"
          gh release download "v$previousVersion" --repo ${{ github.repository }} --pattern $previousMsi --dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-msi-upgrade.ps1 -PreviousMsi (Join-Path $env:RUNNER_TEMP $previousMsi) -CurrentMsi (Resolve-Path "artifacts/installer/DMS-Setup-$version.msi").Path

      - name: Upload tested packages
        uses: actions/upload-artifact@v6
        with:
          name: windows-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/installer/*.msi
          if-no-files-found: error
