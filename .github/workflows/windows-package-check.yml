name: Windows package check

on:
  push:
    branches: [winUI3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-app:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish DMS/DMS.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o artifacts/DMS-win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($path in @('DMS.exe', 'DMS.pri', 'Assets/logo.png')) {
            if (!(Test-Path (Join-Path 'artifacts/DMS-win-x64' $path))) { throw "Missing published file: $path" }
          }
      - name: Compile installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & iscc installer/DMS.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and start DMS with disposable data
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'DMS-installed'
          $setup = (Resolve-Path 'artifacts/installer/DMS-Setup-0.0.1.exe').Path
          $setupLog = Join-Path $env:RUNNER_TEMP 'dms-setup.log'
          $result = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir", "/LOG=$setupLog") -Wait -PassThru
          if ($result.ExitCode -ne 0) { if (Test-Path $setupLog) { Get-Content $setupLog }; throw "Installer exited with $($result.ExitCode)" }
          foreach ($path in @('DMS.exe', 'DMS.pri', 'Assets/logo.png')) {
            if (!(Test-Path (Join-Path $installDir $path))) { throw "Missing installed file: $path" }
          }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'DMS-test-appdata'
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $env:DMS_QA_READY_FILE = Join-Path $env:RUNNER_TEMP 'dms-ready.txt'
          Remove-Item $env:DMS_QA_READY_FILE -Force -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath (Join-Path $installDir 'DMS.exe') -WorkingDirectory $installDir -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            while ((Get-Date) -lt $deadline -and !(Test-Path $env:DMS_QA_READY_FILE)) {
              $app.Refresh()
              if ($app.HasExited) { throw "Installed DMS exited before its main window was ready. Exit code: $($app.ExitCode)" }
              Start-Sleep -Seconds 1
            }
            if (!(Test-Path $env:DMS_QA_READY_FILE)) { throw 'Installed DMS did not reach its main window within 45 seconds.' }
            $localized = Get-Content $env:DMS_QA_READY_FILE -Raw
            if (!$localized -or $localized.Trim() -eq 'MenuViewSelected') { throw 'Installed DMS did not load its localized resources.' }
            Write-Host 'Installed DMS reached its main window and loaded localized resources.'
          } finally {
            $app.Refresh()
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Upload tested installer
        uses: actions/upload-artifact@v4
        with:
          name: DMS-installer-test
          path: artifacts/installer/DMS-Setup-0.0.1.exe
          if-no-files-found: error
      - name: Capture setup welcome screen when desktop is available
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'artifacts/installer/DMS-Setup-0.0.1.exe').Path
          $process = Start-Process -FilePath $setup -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited -or $process.MainWindowHandle -eq 0) {
              Write-Host 'No interactive setup window was available for screenshot capture.'
            } else {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
                $bitmap.Save((Join-Path $env:GITHUB_WORKSPACE 'artifacts/setup-welcome.png'))
              } finally { $graphics.Dispose(); $bitmap.Dispose() }
            }
          } catch { Write-Host "Screenshot unavailable: $_" }
          finally {
            $process.Refresh()
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Upload setup screenshot if captured
        uses: actions/upload-artifact@v4
        with:
          name: DMS-setup-preview
          path: artifacts/setup-welcome.png
          if-no-files-found: ignore
