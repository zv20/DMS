name: WinUI 3 build

on:
  push:
    branches: [winUI3]
  pull_request:
    branches: [winUI3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore DMS.sln

      - name: Build DMS
        run: dotnet build DMS/DMS.csproj --configuration Release --no-restore -p:Platform=x64

      - name: Run tests
        run: dotnet test DMS.sln --configuration Release --no-build --verbosity normal

      - name: Publish unsigned developer build
        run: >-
          dotnet publish DMS/DMS.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:Platform=x64
          --output artifacts/DMS-win-x64

      - name: Upload unsigned developer build
        uses: actions/upload-artifact@v4
        with:
          name: DMS-win-x64-unsigned
          path: artifacts/DMS-win-x64
          if-no-files-found: error
          retention-days: 14