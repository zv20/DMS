name: Windows tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_startup:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Test and measure
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check localization
        run: python scripts/check-localization.py

      - name: Run tests
        run: dotnet test DMS.Tests/DMS.Tests.csproj --configuration Release -p:Platform=x64 --filter "Category!=PerformanceBaseline"

      - name: Measure generated database reads
        shell: pwsh
        run: |
          $env:DMS_PERF_RESULTS_PATH = Join-Path $env:RUNNER_TEMP 'dms-performance/database.json'
          $env:DMS_PERF_UI_DATABASE_PATH = Join-Path $env:RUNNER_TEMP 'dms-performance-fixture/generated.db'
          dotnet test DMS.Tests/DMS.Tests.csproj --configuration Release -p:Platform=x64 --filter "Category=PerformanceBaseline"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath $env:DMS_PERF_RESULTS_PATH)) { throw 'Performance results were not created.' }
          if (!(Test-Path -LiteralPath (Join-Path (Split-Path $env:DMS_PERF_RESULTS_PATH) 'catalog.json'))) { throw 'Catalog performance results were not created.' }
          if (!(Test-Path -LiteralPath $env:DMS_PERF_UI_DATABASE_PATH)) { throw 'Navigation fixture was not created.' }

      - name: Measure startup signal
        if: ${{ !inputs.skip_startup }}
        shell: pwsh
        run: |
          ./scripts/measure-startup.ps1 `
            -Executable 'DMS/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64/DMS.exe' `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'dms-performance/startup.json')

      - name: Measure navigation, preview, and PDF
        if: ${{ !inputs.skip_startup }}
        shell: pwsh
        run: |
          ./scripts/measure-navigation.ps1 `
            -Executable 'DMS/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64/DMS.exe' `
            -Database (Join-Path $env:RUNNER_TEMP 'dms-performance-fixture/generated.db') `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'dms-performance/navigation.json')

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dms-performance/*.json
          if-no-files-found: error
