name: Test and release

on:
  push:
    branches: [test]

concurrency:
  group: dms-automatic-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: Test changes
    permissions:
      contents: read
    uses: ./.github/workflows/windows-checks.yml
    with:
      ref: ${{ github.sha }}

  prepare:
    name: Prepare patch version
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
      version: ${{ steps.prepare.outputs.version }}
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare version and changelog
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin release --tags
          test "$(git ls-remote origin refs/heads/test | cut -f1)" = "$SOURCE_SHA" || { echo 'test has advanced; a newer run will handle it.' >&2; exit 1; }
          if git diff --quiet origin/release HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release list --limit 1000 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/releases.json"
          base=$(git merge-base origin/release HEAD)
          git log --no-merges --format=%s "$base"..HEAD > "$RUNNER_TEMP/subjects.txt"
          version=$(python3 scripts/prepare-release.py "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/subjects.txt")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists; resolve it before retrying." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DMS/DMS.csproj CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare release $version"
            git push origin HEAD:refs/heads/test
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  promote:
    name: Promote tested changes
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      commit: ${{ steps.promote.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - name: Promote versioned commit through the protected branch
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          candidate_tree=$(git rev-parse "$CANDIDATE_SHA^{tree}")
          # A failed publish can be retried without merging the same commit twice.
          prs=$(gh pr list --base release --head test --state all --limit 100 --json number,state,headRefOid,mergeCommit)
          merged=$(jq -r --arg sha "$CANDIDATE_SHA" '[.[] | select(.state == "MERGED" and .headRefOid == $sha)] | first | .mergeCommit.oid // empty' <<< "$prs")
          if [[ -n "$merged" ]]; then
            git fetch origin release
            git merge-base --is-ancestor "$merged" origin/release || exit 1
            test "$(git rev-parse "$merged^{tree}")" = "$candidate_tree" || { echo 'The merged tree differs from the tested commit.' >&2; exit 1; }
            echo "commit=$merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(git ls-remote origin refs/heads/test | cut -f1)" = "$CANDIDATE_SHA" || { echo 'test changed after testing; refusing to release it.' >&2; exit 1; }
          git fetch origin release
          merge_tree=$(git merge-tree --write-tree origin/release "$CANDIDATE_SHA")
          test "$merge_tree" = "$candidate_tree" || { echo 'The release branch has changes not present in the tested commit. Merge release into test and retry.' >&2; exit 1; }
          pr=$(jq -r --arg sha "$CANDIDATE_SHA" '[.[] | select(.state == "OPEN" and .headRefOid == $sha)] | first | .number // empty' <<< "$prs")
          if [[ -z "$pr" ]]; then
            gh pr create --base release --head test --title "Release DMS $RELEASE_VERSION" --body "Automated release of versioned commit $CANDIDATE_SHA."
            pr=$(gh pr list --base release --head test --state open --json number --jq '.[0].number')
          fi
          [[ "$pr" =~ ^[0-9]+$ ]] || exit 1
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run release-pr.yml --ref test -f "expected_sha=$CANDIDATE_SHA" -f "pr_number=$pr"
          run=''
          for attempt in {1..30}; do
            run=$(gh run list --workflow release-pr.yml --branch test --event workflow_dispatch --limit 100 --json databaseId,headSha,createdAt --jq "[.[] | select(.headSha == \"$CANDIDATE_SHA\" and .createdAt >= \"$started\")] | sort_by(.createdAt) | last | .databaseId // empty")
            [[ -n "$run" ]] && break
            sleep 2
          done
          [[ -n "$run" ]] || { echo 'Release branch check did not start.' >&2; exit 1; }
          gh run watch "$run" --exit-status
          gh pr merge "$pr" --merge --match-head-commit "$CANDIDATE_SHA"
          merged=$(gh pr view "$pr" --json mergeCommit --jq '.mergeCommit.oid')
          [[ "$merged" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch origin release
          test "$(git rev-parse "$merged^{tree}")" = "$candidate_tree" || { echo 'The merged tree differs from the tested commit; publication stopped.' >&2; exit 1; }
          echo "commit=$merged" >> "$GITHUB_OUTPUT"
  package:
    name: Build and check release installer
    needs: [prepare, promote]
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.promote.outputs.commit }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $version = "$env:REQUESTED_VERSION".TrimStart('v')
          if (!$version) {
            $version = dotnet msbuild DMS/DMS.csproj -getProperty:Version -p:Platform=x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'MSI packages require a three-part numeric version.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish x64 app for shared runtimes
        run: >-
          dotnet publish DMS/DMS.csproj --configuration Release --runtime win-x64
          --self-contained false -p:WindowsAppSDKSelfContained=false -p:PublishReadyToRun=false -p:Platform=x64
          --output artifacts/DMS-win-x64

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add --global WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add --global WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add --global WixToolset.Bal.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add --global WixToolset.Netfx.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSI installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          $publishDir = (Resolve-Path artifacts/DMS-win-x64).Path
          python scripts/installer-release-notes.py $version artifacts/installer/release-notes.rtf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseNotes = (Resolve-Path artifacts/installer/release-notes.rtf).Path
          wix build installer/DMS.wxs -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -arch x64 -d "Version=$version" -d "PublishDir=$publishDir" -d "ReleaseNotesFile=$releaseNotes" -o "artifacts/installer/DMS-Setup-$version.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase((Resolve-Path "artifacts/installer/DMS-Setup-$version.msi").Path, 0)
          foreach ($dialog in @('WelcomeDlg', 'UpgradeInfoDlg', 'VerifyReadyDlg', 'ExitDialog')) {
            $view = $database.OpenView("SELECT ``Dialog`` FROM ``Dialog`` WHERE ``Dialog`` = '$dialog'")
            $view.Execute()
            if (!$view.Fetch()) { throw "Missing installer dialog: $dialog" }
            $view.Close()
          }

      - name: Build online setup
        shell: pwsh
        run: ./scripts/build-online-setup.ps1 -Msi "artifacts/installer/DMS-Setup-$env:RELEASE_VERSION.msi" -Version $env:RELEASE_VERSION

      - name: Install and start packaged DMS with disposable data
        shell: pwsh
        run: |
          . ./scripts/wait-for-app-file.ps1
          $version = $env:RELEASE_VERSION
          $installDir = Join-Path $env:RUNNER_TEMP 'DMS-installed'
          $setup = (Resolve-Path "artifacts/installer/DMS-Setup-$version.exe").Path
          $setupLog = Join-Path $env:RUNNER_TEMP 'dms-setup.log'
          # A leftover Inno uninstall entry must not block MSI installation.
          $legacyKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{62CF39B5-8F17-4242-9DE5-99B3A75219ED}_is1'
          New-Item -Path $legacyKey -Force | Out-Null
          New-ItemProperty -Path $legacyKey -Name UninstallString -Value 'legacy-uninstaller.exe' -Force | Out-Null
          $result = Start-Process -FilePath $setup -ArgumentList @('/quiet', '/norestart', "InstallFolder=`"$installDir`"", '/log', "`"$setupLog`"") -Wait -PassThru
          if ($result.ExitCode -ne 0) { if (Test-Path $setupLog) { Get-Content $setupLog }; throw "Installer exited with $($result.ExitCode)" }
          foreach ($path in @('DMS.exe', 'DMS.pri', 'Assets/logo.png')) {
            if (!(Test-Path (Join-Path $installDir $path))) { throw "Missing installed file: $path" }
          }
          $dataDir = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'DMS'
          $env:DMS_QA_READY_FILE = Join-Path $env:RUNNER_TEMP 'dms-ready.txt'
          Remove-Item $env:DMS_QA_READY_FILE -Force -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath (Join-Path $installDir 'DMS.exe') -WorkingDirectory $installDir -PassThru
          try {
            Wait-DmsAppFile $app $env:DMS_QA_READY_FILE 'Installed DMS main window startup'
            $localized = Get-Content $env:DMS_QA_READY_FILE -Raw
            if (!$localized -or $localized.Trim() -eq 'MenuViewSelected') { throw 'Installed DMS did not load its localized resources.' }
            Write-Host 'Installed DMS reached its main window and loaded localized resources.'
          } finally {
            $app.Refresh()
            if (!$app.HasExited) {
              Stop-Process -Id $app.Id -Force
              $app.WaitForExit()
            }
          }
          $database = Join-Path $dataDir 'dms.db'
          if (!(Test-Path $database)) { throw 'DMS did not create its database.' }
          $databaseHash = (Get-FileHash $database).Hash
          $result = Start-Process -FilePath $setup -ArgumentList @('/uninstall', '/quiet', '/norestart') -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstall exited with $($result.ExitCode)" }
          if (Test-Path (Join-Path $installDir 'DMS.exe')) { throw 'DMS.exe remained after uninstall.' }
          if (!(Test-Path $database) -or (Get-FileHash $database).Hash -ne $databaseHash) { throw 'Uninstall removed or changed the application database.' }

      - name: Verify upgrade from the previous MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_VERSION
          $previousVersion = gh release list --repo ${{ github.repository }} --limit 1000 --json tagName,isDraft,isPrerelease | python scripts/previous-release.py $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Testing upgrade from $previousVersion to $version"
          $previousRelease = "v$previousVersion"
          $previousSetup = "DMS-Setup-$previousVersion"
          $assets = gh release view $previousRelease --repo ${{ github.repository }} --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($assets -contains "$previousSetup.exe") {
            gh release download $previousRelease --repo ${{ github.repository }} --pattern "$previousSetup.exe" --dir "$env:RUNNER_TEMP"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $extracted = Join-Path $env:RUNNER_TEMP 'previous-setup'
            wix burn extract (Join-Path $env:RUNNER_TEMP "$previousSetup.exe") -o $extracted -oba "$extracted-ba"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $previousMsi = (Get-ChildItem -Path $extracted -Recurse -Filter "$previousSetup.msi").FullName
            if (!$previousMsi) { throw 'Previous setup does not contain the DMS MSI.' }
          } else {
            gh release download $previousRelease --repo ${{ github.repository }} --pattern "$previousSetup.msi" --dir "$env:RUNNER_TEMP"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $previousMsi = Join-Path $env:RUNNER_TEMP "$previousSetup.msi"
          }
          ./scripts/test-msi-upgrade.ps1 -PreviousMsi $previousMsi -CurrentMsi (Resolve-Path "artifacts/installer/DMS-Setup-$version.msi").Path

      - name: Name tested package artifact
        id: artifact
        shell: pwsh
        run: '"name=windows-packages-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT'

      - name: Upload tested packages
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifacts/installer/DMS-Setup-*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, promote, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.promote.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: artifacts/installer
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.promote.outputs.commit }}
        run: |
          set -euo pipefail
          python3 scripts/extract-release-notes.py "$RELEASE_VERSION" release-notes.md
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            git fetch origin "refs/tags/v$RELEASE_VERSION:refs/tags/v$RELEASE_VERSION"
            test "$(git rev-list -n 1 "v$RELEASE_VERSION")" = "$RELEASE_COMMIT" || { echo 'The existing tag points to a different commit.' >&2; exit 1; }
            gh release create "v$RELEASE_VERSION" artifacts/installer/DMS-Setup-*.exe --verify-tag --title "DMS v$RELEASE_VERSION" --notes-file release-notes.md
          else
            gh release create "v$RELEASE_VERSION" artifacts/installer/DMS-Setup-*.exe --target "$RELEASE_COMMIT" --title "DMS v$RELEASE_VERSION" --notes-file release-notes.md
          fi
