name: Package check - manual and changes

on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - '.github/workflows/package-check.yml'
      - '.github/workflows/windows-package.yml'
      - 'scripts/test-msi-upgrade.ps1'
      - 'scripts/wait-for-push-tests.sh'

permissions:
  contents: read
  actions: read

jobs:
  tests:
    name: Wait for push tests
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v6
      - name: Require successful push tests for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_BRANCH: release
        run: bash scripts/wait-for-push-tests.sh

  package:
    name: Build and verify packages without release
    needs: tests
    uses: ./.github/workflows/windows-package.yml
    with:
      version: '0.0.13'
