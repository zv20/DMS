name: Release WinUI 3

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 0.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  tests:
    name: Windows tests
    permissions:
      contents: read
    uses: ./.github/workflows/windows-checks.yml
    with:
      skip_startup: true

  package:
    name: Build and verify packages
    needs: tests
    permissions:
      contents: read
    uses: ./.github/workflows/windows-package.yml
    with:
      version: ${{ inputs.version || github.ref_name }}

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tested packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DMS ${{ inputs.version || github.ref_name }}
          prerelease: ${{ contains(inputs.version || github.ref_name, '-') }}
          generate_release_notes: true
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            artifacts/installer/*.msi
            artifacts/*-portable.zip
