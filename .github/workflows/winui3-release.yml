name: Release - version tag

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    name: Wait for push tests
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tagged commit is on release branch
        run: |
          git fetch origin release
          git merge-base --is-ancestor "$GITHUB_SHA" origin/release || { echo 'Tagged commit is not on the release branch.' >&2; exit 1; }
      - name: Require successful push tests for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-push-tests.sh

  package:
    name: Build and verify packages
    needs: tests
    permissions:
      contents: read
    uses: ./.github/workflows/windows-package.yml
    with:
      version: ${{ github.ref_name }}

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download tested packages
        uses: actions/download-artifact@v7
        with:
          name: windows-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/installer
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          version = os.environ['RELEASE_TAG'].removeprefix('v')
          lines = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          heading = f'## {version}'
          if lines.count(heading) != 1:
              raise SystemExit(f'Expected exactly one changelog section for {version}')
          start = lines.index(heading)
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('## ')), len(lines))
          notes = '\n'.join(lines[start:end]).strip()
          if not any(line.strip() for line in lines[start + 1:end]):
              raise SystemExit(f'Changelog section for {version} is empty')
          pathlib.Path('release-notes.md').write_text(notes + '\n', encoding='utf-8')
          PY
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: DMS ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: artifacts/installer/*.msi
